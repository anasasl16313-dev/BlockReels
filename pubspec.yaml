name: block_reels
description: "A surgical, 100% offline, privacy-first reels & shorts blocker for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1

  # High-Performance Offline Local Storage (Zero Network)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Utilities & Formatting
  uuid: ^4.3.3
  intl: ^0.19.0

  # Cryptography (Offline PIN Hashing with Salt)
  crypto: ^3.0.3

  # UI / Animation / Visualization (100% Offline)
  flutter_animate: ^4.5.0
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
